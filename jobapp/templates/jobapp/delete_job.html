
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Job | CareerTrack</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 50px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #b91c1c;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            background: #dc2626;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            display: inline-block;
            margin-left: 10px;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Delete Job Application?</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ application.company_name }}</strong>
            — {{ application.job_role }}?
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="/" class="cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
