
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job | CareerTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 40px 15px;
        }

        .form-container {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            width: 100%;
            background: #1e3a8a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>Add Job Application</h1>

        <p class="subtitle">
            Enter your job application details below.
        </p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Application</button>
        </form>

        <a href="/" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
